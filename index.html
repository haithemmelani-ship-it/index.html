  <section id="membership" class="content-section">
    <div class="section-head">
      <div class="dotted-arrow">بوابة العضوية <span class="tip">▸</span></div>
      <h2>تقديم طلب انخراط واستخراج رمز العضوية</h2>
      <p>أدخل بياناتك لاختيار اللجنة المناسبة وتوليد رمز عضوية فوري بصيغة <strong class="brand-latin">MUIN-2026-XXXX</strong>.</p>
    </div>

    <div class="membership-panel">
      <form id="membershipForm">
        <div class="form-group">
          <label for="memberName">الاسم الكامل</label>
          <input type="text" id="memberName" placeholder="مثال: هيثم ملياني" required />
        </div>
        <div class="form-group">
          <label for="memberRoom">الجناح / الغرفة بالإقامة الجامعية</label>
          <input type="text" id="memberRoom" placeholder="مثال: جناح ب - غرفة 14" required />
        </div>
        <div class="form-group">
          <label for="memberCommittee">اللجنة المرغوبة</label>
          <select id="memberCommittee" required>
            <option value="اللجنة العلمية والتكوينية">اللجنة العلمية والتكوينية</option>
            <option value="اللجنة الثقافية والإعلامية">اللجنة الثقافية والإعلامية</option>
            <option value="اللجنة الاجتماعية والتطوعية">اللجنة الاجتماعية والتطوعية</option>
            <option value="لجنة التنظيم واللوجستيك">لجنة التنظيم واللوجستيك</option>
          </select>
        </div>

        <div style="display:flex; gap:0.7rem; flex-wrap:wrap; margin-top:0.5rem;">
          <button type="submit" class="btn btn-plum">إصدار رمز العضوية</button>
          <button type="button" id="sendWhatsappBtn" class="btn" style="background:#1f7a46; color:#fff;">
            إرسال الطلب عبر واتساب
          </button>
        </div>

        <div class="status-msg" id="membershipStatus"></div>
      </form>

      <div class="id-card-preview">
        <div class="brand-latin" style="font-size:0.85rem; color:#f3d2a2;">AL-MU'ĪN MEMBERSHIP PASS</div>
        <h3 id="previewName" style="margin-top:0.4rem; font-size:1.25rem;">الاسم الكامل</h3>
        <p id="previewRoom" style="font-size:0.9rem; opacity:0.9;">الجناح / الغرفة بالإقامة الجامعية</p>
        <p id="previewCommittee" style="font-size:0.88rem; color:#f3d2a2; font-weight:700; margin-top:0.25rem;">
          اللجنة العلمية والتكوينية
        </p>

        <div class="id-badge-code">
          <span>رمز العضوية الصادر</span>
          <strong id="previewCode">MUIN-2026-0000</strong>
        </div>
      </div>
    </div>
  </section>

  <script>
    // استبدل هذا الرقم برقم الواتساب الخاص بالإدارة بالصيغة الدولية بدون (+) أو أصفار بادئة
    const WHATSAPP_ADMIN_PHONE = "213XXXXXXXXX";
    let currentMembershipCode = "";

    function generateMuinCode() {
      const num = Math.floor(1000 + Math.random() * 9000);
      return `MUIN-2026-${num}`;
    }

    function getFormData() {
      const name = document.getElementById("memberName").value.trim();
      const room = document.getElementById("memberRoom").value.trim();
      const committee = document.getElementById("memberCommittee").value.trim();
      return { name, room, committee };
    }

    function updatePassPreview(name, room, committee, code) {
      document.getElementById("previewName").textContent = name || "الاسم الكامل";
      document.getElementById("previewRoom").textContent = room || "الجناح / الغرفة بالإقامة الجامعية";
      document.getElementById("previewCommittee").textContent = committee || "اللجنة المرغوبة";
      document.getElementById("previewCode").textContent = code || "MUIN-2026-0000";
    }

    document.getElementById("membershipForm").addEventListener("submit", function (e) {
      e.preventDefault();
      const { name, room, committee } = getFormData();
      if (!name || !room || !committee) return;

      currentMembershipCode = generateMuinCode();
      updatePassPreview(name, room, committee, currentMembershipCode);

      const statusEl = document.getElementById("membershipStatus");
      statusEl.textContent = `تم إصدار الرمز (${currentMembershipCode}). يمكنك الآن الضغط على "إرسال الطلب عبر واتساب" لتأكيد طلبك.`;
      statusEl.classList.add("show");
    });

    document.getElementById("sendWhatsappBtn").addEventListener("click", function () {
      const { name, room, committee } = getFormData();
      const statusEl = document.getElementById("membershipStatus");

      if (!name || !room || !committee) {
        statusEl.textContent = "يرجى إدخال الاسم الكامل والجناح/الغرفة واختيار اللجنة أولاً.";
        statusEl.classList.add("show");
        return;
      }

      if (!currentMembershipCode) {
        currentMembershipCode = generateMuinCode();
        updatePassPreview(name, room, committee, currentMembershipCode);
      }

      const message =
        `طلب انضمام - نادي المُعين (الإقامة الجامعية 19 ماي 1956)\n` +
        `----------------------------\n` +
        `الاسم الكامل: ${name}\n` +
        `الجناح / الغرفة: ${room}\n` +
        `اللجنة المرغوبة: ${committee}\n` +
        `رمز العضوية: ${currentMembershipCode}`;

      const url = `https://wa.me/${WHATSAPP_ADMIN_PHONE}?text=${encodeURIComponent(message)}`;
      window.open(url, "_blank", "noopener,noreferrer");
    });
        </script>
